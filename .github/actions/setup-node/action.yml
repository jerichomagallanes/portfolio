name: Set up Node
description: >
  Installs the Node version pinned in .nvmrc, restores the npm cache and
  installs dependencies from the lockfile. Shared by every workflow so the
  toolchain is defined in exactly one place.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # `npm ci` installs exactly what package-lock.json specifies and fails if
    # the lockfile is out of sync — the reproducible counterpart to `npm install`.
    - name: Install dependencies
      run: npm ci
      shell: bash
