name: Deploy

# Production deploys happen only from main, which is protected — so everything
# that ships has been through a pull request and passed CI first.
on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit,
  # e.g. after rotating a Cloudflare token.
  workflow_dispatch:

# Never cancel a production deploy midway; queue the next one behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://jerichomagallanes.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      # The same three checks CI runs on the PR. They are repeated here because
      # main can also move via an admin bypass or a direct workflow_dispatch,
      # and a broken build must never reach the live site.
      - name: Type check
        run: npm run check

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jerichomagallanes --branch=main
